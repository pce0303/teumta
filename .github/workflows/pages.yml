name: Deploy support site

# App Store Connect의 지원 URL·개인정보처리방침 URL로 쓰는 정적 페이지를 배포한다.
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 바꿔야 동작한다.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포를 취소하지 않는다(공개 URL이 잠깐 비지 않도록).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload web/
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4

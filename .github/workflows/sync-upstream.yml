# fork(pce0303/teumta) main을 org(saesgil-yulamdan/teumta) main으로 자동 동기화.
#
# 배경: Cloudtype 배포가 fork의 main을 보고 있어서, org main에 머지해도
# fork main을 갱신하지 않으면 구버전이 배포된다(2026-08-07 실제 발생).
#
# - fork에서만 실행된다(org 저장소에 이 파일이 있어도 repository 가드로 스킵).
# - fast-forward만 허용 — fork main이 org와 갈라져 있으면 덮어쓰지 않고 실패한다.
# - 머지 직후 즉시 반영하려면 Actions 탭에서 수동 실행(workflow_dispatch).
name: Sync fork main with upstream

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'pce0303/teumta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main from upstream
        run: |
          git remote add upstream https://github.com/saesgil-yulamdan/teumta.git
          git fetch upstream main
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          if [ "$BEHIND" = "0" ]; then
            echo "이미 최신 상태."
            exit 0
          fi
          echo "upstream보다 ${BEHIND}커밋 뒤 — fast-forward 진행."
          git merge --ff-only upstream/main
          git push origin main
